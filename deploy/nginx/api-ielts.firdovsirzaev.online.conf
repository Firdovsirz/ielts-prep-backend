# api-ielts.firdovsirzaev.online → IELTS Prep API (Spring Boot container on 127.0.0.1:8300)
#
# Install (Debian/Ubuntu nginx):
#   cp deploy/nginx/api-ielts.firdovsirzaev.online.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/api-ielts.firdovsirzaev.online.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api-ielts.firdovsirzaev.online      # adds HTTPS and the http→https redirect
#
# The port must match BACKEND_PORT in ~/ielts-prep/.env (deploy.sh prints it).

upstream ielts_api {
    server 127.0.0.1:8300;
    keepalive 16;
}

# Slows down password guessing: 10 login attempts per minute per client IP (short bursts allowed).
limit_req_zone $binary_remote_addr zone=ielts_api_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api-ielts.firdovsirzaev.online;

    # Speaking recordings are uploaded as multipart audio.
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Grading, coach reports and plan personalisation can take a minute.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/auth/login {
        limit_req zone=ielts_api_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ielts_api;
    }

    # /api/**, Swagger UI (/swagger-ui.html), the OpenAPI spec (/v3/api-docs) and /actuator/health.
    location / {
        proxy_pass http://ielts_api;
    }
}
