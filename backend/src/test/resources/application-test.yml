spring:
  datasource:
    url: jdbc:h2:mem:ielts-test;DB_CLOSE_DELAY=-1
ielts:
  grading:
    async: false
  data-dir: ./../data
  prompts-dir: ./../prompts
  recordings-dir: ./target/test-recordings
  scheduling:
    enabled: false
  buffer:
    enabled: false
  admin:
    email: tester@example.com
    password: test-password-123
  security:
    jwt-secret: test-secret
claude:
  # Never touch a real key saved in data/ during tests.
  api-key-file: ./target/test-api-key
  api-key: ""
